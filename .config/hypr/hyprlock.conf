# BACKGROUND
background {
    monitor =
    path = /home/annguyen/Pictures/Wallpapers/dark/jellyfish.jpg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time-Hour
label {
    monitor =
    #text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 120
    font_family = JetBrains Mono Bold
    position = 0, 100 #-80, 190
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B, %a.")"
    color = rgb(205, 214, 244)
    font_size = 30
    font_family = JetBrains Mono
    position = 0, -30
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =    $USER
    color = rgba(186, 194, 222, 1)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 22
    font_family = JetBrains Mono
    position = 0, -210
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 80
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = <i><span foreground="##ffffff99">🔒 Password</span></i>
    hide_input = false
    position = 0, -290
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/songdetail.sh)" 
    color = rgb(245, 224, 220)
    font_size = 20
    font_family = JetBrains Mono Nerd Font, Adwaita Sans Bold
    position = 0, 30
    halign = center
    valign = bottom
}
