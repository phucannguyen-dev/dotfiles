## ANIMATION ##

animations {
    enabled = true

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    bezier = smoothOut, 0.31, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = softSnap, 0.4, 0, 0.2, 1
    bezier = fluent, 0.0, 0.0, 0.2, 1.0
    bezier = easeInOutExpo, 0.87, 0, 0.13, 1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    #animation = windows,       1,     4.79,  easeOutQuint
    #animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    #animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = windows,       1,     5,  overshot, popin 80%
    animation = windowsIn,     1,     5,  overshot, popin 80%
    animation = windowsOut,    1,     5,  smoothOut, popin 95%
    animation = windowsMove,   1,     4,  softSnap

    animation = fadeIn, 1, 4,  smoothIn
    animation = fadeOut, 1, 4,  smoothOut
    animation = fade, 1, 4,  smoothIn
    animation = fadeSwitch, 1, 4, smoothIn
    animation = fadeShadow, 1, 4, smoothIn
    animation = fadeDim, 1, 4, smoothIn
    animation = fadeDpms, 1, 4, smoothIn
    animation = fadeLayers, 1, 3, softSnap

    animation = layers,        1,     4,  smoothIn
    animation = layersIn,      1,     4,  smoothIn, slideright
    animation = layersOut,     1,     4, softSnap, slideright
    #animation = fadeLayersIn,  1,     1.79,  almostLinear
    #animation = fadeLayersOut, 1,     1.39,  almostLinear

    animation = workspaces, 1, 5,  overshot, slidefade

    animation = zoomFactor,    1,     7,     quick
}


